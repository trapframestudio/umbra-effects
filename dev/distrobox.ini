# ZGO development container (not shipped). Create or update it with dev/setup.sh.
#
#   mingw64-*      cross compiler for the native add-on (bin/zgo_native.dll, Windows x64)
#   python3-numpy  the mesh baker (tools/zgo_baker)
#   luajit         the test harness (tests/) and the baker's table reader
#   wine           running Windows builds (the DLL test host, the bundled baker) locally
[zgo-dev]
image=registry.fedoraproject.org/fedora-toolbox:44
pull=true
init=false
start_now=false
additional_packages="mingw64-gcc mingw64-gcc-c++ mingw64-winpthreads-static mingw64-headers mingw64-crt"
additional_packages="cmake ninja-build make git zip unzip p7zip p7zip-plugins"
additional_packages="python3 python3-pip python3-numpy luajit lua"
additional_packages="wine-core wine-common"
